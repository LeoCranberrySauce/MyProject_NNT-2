services:
  # 1. Frontend Application (React, Vue, Vite, etc.)
  - type: web
    name: waynu-frontend
    runtime: node # Use 'static' if it is purely static HTML/JS without a custom server
    rootDir: frontend
    plan: free
    buildCommand: "npm install && npm run build"
    startCommand: "npm run dev"
    region: singapore
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: waynu-backend
          property: host

  # 2. Admin Panel (Separate Dashboard app)
  - type: web
    name: waynu-admin
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: "npm install && npm run build"
    startCommand: "npm run dev"
    region: singapore
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: waynu-backend
          property: host

  # 3. Node.js Backend API
  - type: web
    name: waynu-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: "npm install"
    startCommand: "npm start" # Use production start script (node server.js)
    region: singapore
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: app-db
          property: connectionString

# 4. Optional Database (PostgreSQL)
databases:
  - name: app-db
    plan: free
    region: singapore
